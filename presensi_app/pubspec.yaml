name: presensi_app
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  intl: ^0.19.0
  http: ^1.1.0 # http: ^0.13.6 buat http request
  flutter_secure_storage: ^9.0.0
  qr_code_scanner: ^1.0.1
  geolocator: ^10.0.0
  dio: ^5.7.0
  collection: ^1.17.2
  file_picker: ^8.0.0
  camera: ^0.10.5+5
  geocoding: ^2.1.1 # mengubah koordinat menjadi alamat
  image_picker: 1.0.7 # mengambil gambar dari kamera atau galeri
  google_maps_flutter: ^2.5.3 # menampilkan peta lokasi pada detail presensi
  flutter_map: ^6.1.0 # alternatif google maps
  latlong2: ^0.9.1 # flutter_map
  pdf: ^3.10.8 #
  printing: ^5.12.0 # export file
  path_provider: ^2.1.3 # simpan pada storage device
  permission_handler: ^10.4.3 # permission storage device
  # month_year_picker: ^0.3.0+1 # month year picker
  url_launcher: ^6.2.4
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^18.0.1 # notifikasi
  timezone: ^0.9.2 # timezone
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  flutter_image_compress: ^2.3.0
  # google_mlkit_face_detection: ^0.11.0 # real-time face detection ^0.11.0
  # image: ^4.2.0 # watermarking: menuliskan teks koordinat dan alamat di atas piksel gambar
  # geo_tag_camera: ^1.0.2
  # permission_handler: ^10.4.5 # untuk mengelola izin akses fitur perangkat (seperti kamera, lokasi, kontak, penyimpanan)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ # Pastikan ada garis miring di akhir!
    - assets/default_profile.png
    - assets/bhayangkara.png
